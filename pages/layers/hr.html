<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR</title>

    <link rel="stylesheet" href="../../frameworks/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../frameworks/fontawesome/css/fontawesome.min.css">
    <link rel="stylesheet" href="../../frameworks/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../../styles/layers/hr.css">
</head>

<body>
    <div id="navbar-elm"></div>

    <div class="hr container-fluid">
        <ul class="nav nav-tabs py-4" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active text-black fw-bold fs-5" id="dashboard-tab" data-bs-toggle="tab"
                    data-bs-target="#dashboard-section" type="button" role="tab" aria-controls="dashboard-section"
                    aria-selected="true">Dashboard</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link text-black fw-bold fs-5" id="reports-tab" data-bs-toggle="tab"
                    data-bs-target="#reports-section" type="button" role="tab" aria-controls="reports-section"
                    aria-selected="false">Reports</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link text-black fw-bold fs-5" id="reports-tab" data-bs-toggle="tab"
                    data-bs-target="#reports-section" type="button" role="tab" aria-controls="reports-section"
                    aria-selected="false">setting</button>
            </li>
        </ul>

        <div class="tab-content" id="myTabContent">
            <div class="tab-pane fade show active" id="dashboard-section" role="tabpanel"
                aria-labelledby="dashboard-tab">
                <div class="row">
                    <div id="employee-management-section" class="col-12 mb-3">
                        <div class="p-3 border rounded w-100">
                            <h4 class="mb-3 fw-bold fs-1 text-center py-4">Employee Management</h4>
                            <div class="d-flex justify-content-around gap-4 align-items-center mb-5">
                                <input id="searchInput" type="text" class="form-control   p-2"
                                    placeholder="Search employee...">


                                <select id="searchCriteria" class="form-select w-50  me-2">
                                    <option value="name">Name</option>
                                    <option value="department">Department</option>
                                </select>




                            </div>

                            <div class="table-responsive rounded-2">
                                <table class="table table-striped ">
                                    <thead class="sticky-top">
                                        <tr>

                                            <th scope="col" class="table-header">Emp ID</th>
                                            <th scope="col" class="table-header">Name</th>
                                            <th scope="col" class="table-header">Department</th>
                                            <th scope="col" class="table-header">Status</th>
                                            <th scope="col" class="table-header">Leave Balance</th>
                                            <th scope="col" id="increase" class="table-header">Increase</th>
                                            <th scope="col" id="descrese" class="table-header">DeCrease</th>
                                            <th  scope="col" id="awards" class="table-header">Awards</th>
                                        </tr>
                                    </thead>
                                    <tbody id="employee-table-body"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>



            </div>

            <div class="tab-pane fade" id="reports-section" role="tabpanel" aria-labelledby="reports-tab">
                <h2 class="text-center py-5 fw-bold fs-1 mb-4">Company Reports</h2>

                <div class="text-start  mt-3">
                    <h4 class="fw-bold fs-1">Total Employees: <span id="totalEmployees">0</span></h4>
                </div>

                <div class="row mb-3 py-5">
                    <div class="col-md-4">
                        <label class="form-label">Department</label>
                        <select id="filterDepartment" class="form-select">
                            <option value="">All</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Month</label>
                        <select id="filterMonth" class="form-select">
                            <option value="">All</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Status</label>
                        <select id="filterStatus" class="form-select">
                            <option value="">All</option>
                            <option value="Present">Present</option>
                            <option value="Late">Late</option>
                            <option value="Absent">Absent</option>
                        </select>
                    </div>
                </div>

                <div class="row text-center mb-5 py-5 ">
                    <div class="col-md-4">
                        <canvas id="barChart"></canvas>
                    </div>
                    <div class="col-md-4">
                        <canvas id="pieChart"></canvas>
                    </div>
                    <div class="col-md-4">
                        <canvas id="lineChart"></canvas>
                    </div>
                </div>

                <div class="text-end mb-3">
                    <button id="exportExcel" class="btn btn-success me-2">Export to Excel</button>
                    <button id="exportPDF" class="btn btn-danger">Export to PDF</button>
                </div>

               
                <div class="table-responsive rounded-2">
                     <table class="table table-striped">
                    <thead class="sticky-top">
                        <tr>
                            <th scope="col" class="table-header">Name</th>
                            <th scope="col" class="table-header">Department</th>
                            <th scope="col" class="table-header">Date</th>
                            <th scope="col" class="table-header">Status</th>
                            <th scope="col" class="table-header">Notes</th>
                        </tr>
                    </thead>
                    <tbody id="reportTableBody"></tbody>
                </table>
                </div>
            </div>
        </div>
    </div>

    <script src="../../frameworks/bootstrap/js/bootstrap.bundle.js"></script>
    <script type="module" src="../../scripts/layers/hrFunctions.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>

</html>
