<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee</title>

  <!-- CSS -->
  <link rel="stylesheet" href="../../frameworks/bootstrap/css/bootstrap.min.css"> <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="../../frameworks/fontawesome/css/fontawesome.min.css"> <!-- FontAwesome CSS -->
  <link rel="stylesheet" href="../../frameworks/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="../../styles/index.css"> <!-- Base CSS style -->
  <link rel="stylesheet" href="../../styles/layers/employee.css"> <!-- Employee CSS style -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />


</head>

<body>
  <div id="navbar-elm"></div>

  <!-- Main Content -->
  <main class="employee container my-4 p-4 bg-white rounded shadow-sm">
    <h1 class="text-center text-md-start animate__animated animate__fadeInUp emp-name">Welcome Back</h1>
    <br>
    <!-- Navigation Tabs -->
    <ul class="nav nav-tabs" id="center-tabs">
      <li class="nav-item">
        <a class="nav-link active">Profile</a>
      </li>
      <li class="nav-item">
        <a class="nav-link">Tasks</a>
      </li>
      <li class="nav-item">
        <a class="nav-link">Requests</a>
      </li>
      <li class="nav-item">
        <a class="nav-link">Attendance</a>
      </li>
    </ul>
    <!-- User Profile -->
        <div class="center-section my-5">
            <div id="profile"></div>
        </div>
    <!-- ================== Tasks ================== -->
    <section id="tasks-center" class="center-section mt-4" style="display: none;">
      <h3 class="text-center text-md-start emp-title mb-4">My Tasks</h3>
      <div class="row text-dark g-4 text-center text-md-start">
        <!-- To Do -->
        <div class="col-12 col-md-4">
          <div class="card h-100 bg-light border-0 shadow-sm task-holder">
            <div class="card-body task-holder">
              <h4 class="card-title emp-name task-title">Pending</h4>
              <ul id="Pending" class="list-unstyled"></ul>
            </div>
          </div>
        </div>
        <!-- Doing -->
        <div class="col-12 col-md-4">
          <div class="card h-100 bg-light border-0 shadow-sm task-holder">
            <div class="card-body task-holder">
              <h4 class="card-title emp-name task-title"> In Progress</h4>
              <ul id="In Progress" class="list-unstyled"></ul>
            </div>
          </div>
        </div>
        <!-- Done -->
        <div class="col-12 col-md-4">
          <div class="card h-100 bg-light border-0 shadow-sm task-holder">
            <div class="card-body task-holder">
              <h4 class="card-title emp-name task-title">Completed</h4>
              <ul id="Completed" class="list-unstyled"></ul>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ================== Requests ================== -->
    <section id="requests-center" class="center-section mt-4" style="display:none;">
      <h3 class="emp-title mb-4">Request Center</h3>

      <!-- Form -->
      <form id="request-form" class="row g-3 mb-4">
        <div class="table-responsive ">
          <div class="col-md-12">

            <label class="form-label request-label">Request Type</label>
            <select id="request-type" class="form-select mb-4" required>
              <option value="Late">Late</option>
              <option value="Absence">Absence</option>
              <option value="WFH">Work From Home</option>
              <option value="Overtime">Overtime</option>
              <option value="Deadline Extension">Deadline Extension</option>
            </select>
          </div>
          <div class="col-md-12">
            <label class="form-label">Date</label>
            <input type="date" id="request-date" class="form-control  mb-4" required>
          </div>
          <div class="col-12">
            <label class="form-label">Details</label>
            <textarea id="request-details" class="form-control  mb-4" placeholder="Enter details"></textarea>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary mb-4">Submit Request</button>
          </div>
      </form>

      <!-- Real-time Quota Counter -->
      <div class="my-5">
        <h5 class="mb-3 emp-title">Quota Usage</h5>
        <ul id="quota-list" class="list-group"></ul>
      </div>

      <!-- Requests Table -->
      <h5 class="my-3 emp-title">My Requests</h5>
      <table id="requests-table" class="table">
        <thead>
          <tr>
            <th scope="col" class="table-header">Type</th>
            <th scope="col" class="table-header">Date</th>
            <th scope="col" class="table-header">Details</th>
            <th scope="col" class="table-header">Status</th>
          </tr>
        </thead>
        <tbody id="requests-table-body"></tbody>
      </table>
      <div class="d-flex justify-content-center">
        <div class="pagination" id="pagination-requests"></div>
      </div>
    </section>

    <!-- ================== Attendance ================== -->
    <section id="attendance-center" class="center-section mt-4" style="display:none;">
      <h3 class="emp-title mb-4">Attendance Records</h3>
      <div class="table-responsive">

        <table id="attendance-table" class="table">
          <thead>
            <tr>
              <th scope="col" class="table-header">Employee ID</th>
              <th scope="col" class="table-header">Name</th>
              <th scope="col" class="table-header">Date</th>
              <th scope="col" class="table-header">Status</th>
              <th scope="col" class="table-header">Notes</th>
            </tr>
          </thead>
          <tbody id="attendance-table-body"></tbody>
        </table>
        <div class="d-flex justify-content-center">
          <div class="pagination" id="pagination-attendance"></div>
        </div>
    </section>
  </main>

  <!-- JS Tags -->
  <script src="../../frameworks/bootstrap/js/bootstrap.bundle.js"></script> <!-- Bootstrap JS -->



  <script type="module" src="../../scripts/layers/employeeFunctions.js"></script> <!-- Employee JS -->
</body>

</html>
